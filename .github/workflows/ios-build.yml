name: iOS Cloud Build

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract project
        run: |
          unzip -q YouTubeMusicKaraoke_Starter.zip -d extracted
          cp -R extracted/YouTubeMusicKaraoke .
          cp -R extracted/YouTubeMusicKaraoke.xcodeproj .
          rm YouTubeMusicKaraoke_Starter.zip

      - name: Commit source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add YouTubeMusicKaraoke YouTubeMusicKaraoke.xcodeproj
          if ! git diff --cached --quiet; then
            git commit -m "Add SwiftUI starter project"
            git push
          else
            echo "Source files already committed; continue to build."
          fi
          
      - name: Diagnose Xcode environment
        run: |
          uname -a
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list devices available

      - name: Validate Xcode project
        run: |
          plutil -lint YouTubeMusicKaraoke.xcodeproj/project.pbxproj
          xmllint --noout YouTubeMusicKaraoke.xcodeproj/xcshareddata/xcschemes/YouTubeMusicKaraoke.xcscheme
          xcodebuild -list -project YouTubeMusicKaraoke.xcodeproj
          xcodebuild -showBuildSettings \
            -project YouTubeMusicKaraoke.xcodeproj \
            -scheme YouTubeMusicKaraoke \
            -configuration Debug

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project YouTubeMusicKaraoke.xcodeproj \
            -scheme YouTubeMusicKaraoke \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
