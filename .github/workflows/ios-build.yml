name: iOS Cloud Build

on:
  push:
    paths:
      - '**.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q YouTubeMusicKaraoke_Starter.zip -d extracted
          cp -R extracted/YouTubeMusicKaraoke .
          cp -R extracted/YouTubeMusicKaraoke.xcodeproj .
          rm YouTubeMusicKaraoke_Starter.zip

      - name: Commit source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add YouTubeMusicKaraoke YouTubeMusicKaraoke.xcodeproj
          git commit -m "Add SwiftUI starter project"
          git push

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project YouTubeMusicKaraoke.xcodeproj \
            -scheme YouTubeMusicKaraoke \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeMusicKaraoke-iOS
          path: build/Build/Products/Debug-iphonesimulator/YouTubeMusicKaraoke.app
